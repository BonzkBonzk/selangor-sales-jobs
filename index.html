      ${Object.entries(fieldsMap).map(([key,labels]) => typeof labels === 'string'
        ? `<label>${labels}<input name="${key}" value="${esc(job?.[key])}"${['postedAt','expiresAt'].includes(key) ? ' type="date"' : ''}></label>`
        : `<label>${fieldLabels[key]}<select name="${key}">${opt(labels,job?.[key] || '')}</select></label>`).join('')}
      </div><div class="grid-fields"><label>工作内容<textarea name="summary" rows="4">${esc(job?.summary)}</textarea></label>
      <label>职位要求 · 每行一条<textarea name="requirements" rows="4">${esc(job?.requirements.map(req => (req.preferred ? '＋ ' : '') + req.label).join('\n'))}</textarea><small>加分项可用「＋ 」开头。</small></label></div></details>
      <div class="form-actions"><button class="primary" type="submit">保存职位</button></div></form>`);
    const form = $('job-form');
    const autofill = () => {
      const raw = form.elements.original.value.trim();
      if (!raw) return false;
      for (const [key,value] of Object.entries(extract(raw))) {
        if (value && !form.elements[key].value) form.elements[key].value = value;
      }
      return true;
    };
    $('extract').onclick = () => {
      if (!autofill()) return notify('请先贴上广告原文或上传文字档。');
      $('edit-fields').open = true;
      $('extract-note').textContent = '请核对提取字段，缺失资料会保留待确认。';
    };
    if ($('upload')) $('upload').onchange = async event => {
      const file = event.target.files[0];
      if (!file) return;
      try {
        if (file.size > 700000) throw Error('请选择小于 700 KB 的文件。');
        const raw = await file.text();
        if (/\.json$/i.test(file.name)) {
          useResult(await mutate('import',JSON.parse(raw)),true);
          $('modal').close();
          notify('已导入职位资料。');
        } else {
          form.elements.original.value = raw;
          $('extract').click();
        }
      } catch (error) { notify(error.message); }
    };
    form.onsubmit = async event => {
      event.preventDefault();
      if (!job && !$('edit-fields').open) autofill();
      const input = Object.fromEntries(new FormData(form));
      input.requirements = input.requirements.split(/\r?\n/).flatMap(line => {
        const preferred = line.trim().startsWith('＋') || line.trim().startsWith('+');
        const label = line.trim().replace(/^[＋+]\s*/,'');
        if (!label) return [];
        return [{ label, preferred, key:job?.requirements.find(row => row.label === label)?.key || inferKey(label) }];
      });
      try {
        useResult(await mutate(job ? 'edit' : 'add',job ? {id:job.id,fields:input} : input),!job || !matchesTab({...job,...input},tab));
        $('modal').close();
        notify('已保存职位。');
      } catch (error) { notify(error.message); $('edit-fields').open = true; }
    };
  }
  function showSources() {
    modal('更新与来源', `<p class="explain">${readOnly ? '职位资料来自以下 ' + boards.length + ' 个招聘网站，可打开原站查找。' : '每天约 9:00（马来西亚时间）查找职位。本页打开时每两分钟读取新结果。'}</p>
      <p>${desk.feedError ? esc(desk.feedError) : desk.checkedAt ? '最近查找 · ' + formatTime(desk.checkedAt) : '尚无定时查找记录'}</p>
      <p class="explain">初始职位核对 · ${esc(formatTime(desk.seedCheckedAt,true) || '—')}</p>
      ${boards.map(([name,url]) => `<div class="source-line"><div><b>${esc(name)}</b><small>${esc(desk.sources[name]?.status || '可打开原站查找')}${desk.sources[name]?.checkedAt ? ' · ' + formatTime(desk.sources[name].checkedAt) : ''}</small></div>
      <a href="${esc(isJapanese() ? ({JobStreet:'https://my.jobstreet.com/japanese-speaker-jobs/in-Selangor/full-time',LinkedIn:'https://www.linkedin.com/jobs/search/?keywords=Japanese%20speaker&location=Selangor%2C%20Malaysia&f_JT=F',Maukerja:'https://www.maukerja.my/en/jobsearch/japanese-speaker-jobs-in-selangor',Indeed:'https://malaysia.indeed.com/jobs?q=japanese+speaker&l=Selangor'})[name] || url : url)}" target="_blank" rel="noopener noreferrer">打开搜寻 ↗</a></div>`).join('')}
      ${readOnly ? '' : '<div class="form-actions"><button id="reload" class="primary">读取最新结果</button></div>'}`);
    if (readOnly) return;
    $('reload').onclick = async () => {
      try { await refresh(true); showSources(); notify('已读取本地职位结果。'); }
      catch (error) { notify(error.message); }
    };
  }
  $('close').onclick = () => $('modal').close();
  $('profile').onclick = () => showProfile();
  $('profile-select').value = activeProfile;
  $('profile-select').onchange = event => {
    activeProfile = event.target.value === 'JW' ? 'JW' : 'KH';
    storeBrowser('sales.profile', activeProfile);
    setTab('match');
  };
  if (!readOnly) {
    $('add').onclick = () => showEditor();
  } else {
    if ($('public-sources')) $('public-sources').onclick = showSources;
    $('share').onclick = async () => {
      try { await navigator.clipboard.writeText(location.href); notify('已复制分享链接。'); }
      catch { notify('请从浏览器地址栏复制链接。'); }
    };
  }
  $('sources').onclick = showSources;
  $('browse-industries').onclick = () => {
    setTab('match');
    $('industries').querySelector('button').focus();
  };
  $('industries').onclick = event => {
    const button = event.target.closest('[data-industry]');
    if (!button) return;
    industry = button.dataset.industry;
    render();
    $('industries').querySelector('[aria-pressed=true]')?.focus();
  };
  $('list').onclick = event => {
    const button = event.target.closest('[data-id]');
    if (!button) return;
    selected = button.dataset.id;
    render();
    if (matchMedia('(max-width:680px)').matches) $('detail').scrollIntoView({ block:'start' });
  };
  document.querySelectorAll('[data-tab]').forEach(button => button.onclick = () => setTab(button.dataset.tab));
  $('search').oninput = render;
  ['source','commission-filter','sort'].forEach(id => $(id).onchange = render);
  const saveSalary = () => {
    const low = Number($('salary-min').value) || 0, high = Number($('salary-max').value) || 0;
    if (low < 0 || high < 0 || (high && low > high)) {
      notify('最低薪资须小于或等于最高薪资。');
      return;
    }
    Object.assign(profile(),{salaryMin:low,salaryMax:high,includeUndisclosed:$('salary-unknown').checked});
    saveProfiles();render();
  };
  for (const id of ['salary-min','salary-max','salary-unknown']) $(id).onchange = saveSalary;
  if (readOnly) {
    const snapshot = JSON.parse(publicData.textContent);
    const today = new Date(Date.now() + 8 * 3600000).toISOString().slice(0,10);
    const cutoff = Date.parse(today) - 30 * 86400000;
    desk = {
      ...desk, today, checkedAt:snapshot.checkedAt, seedCheckedAt:snapshot.seedCheckedAt,
      jobs:snapshot.jobs.filter(job => ((job.postedAt && Date.parse(job.postedAt) >= cutoff
        && job.postedAt <= today) || (!job.postedAt && job.datePending && Date.parse(job.verifiedAt) >= Date.now()-7*86400000))
        && (!job.expiresAt || job.expiresAt >= today))
        .map(job => ({ ...job, id:job.url, answers:{}, stage:'new', employment:'full-time',
          listingStatus:'active' }))
    };
    render();
  } else {
    refresh(true).catch(error => notify(error.message));
    setInterval(() => { if (!$('modal').open && !saving) refresh().catch(error => notify(error.message)); },120000);
  }
})();
</script>
</body>
</html>
