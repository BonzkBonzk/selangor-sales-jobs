<!doctype html>
<html lang="zh-MY">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#f3f5f1">
<title>Job</title>
<link rel="stylesheet" href="style.css">
<script defer src="app.js"></script>
</head>
<body>
<header class="top"><div class="shell top-inner">
  <a class="brand" href="./"><span class="brand-mark" aria-hidden="true">↗</span> Job</a>
  <nav aria-label="档案与设置">
    <div class="seg" role="group" aria-label="选择档案"><button data-profile="KH">KH 销售</button><button data-profile="JW">JW 日语</button></div>
    <button id="open-settings" class="flat">我的条件</button>
  </nav>
</div></header>

<main class="shell">
  <section class="intro">
    <div>
      <h1 id="title">销售职位</h1>
      <p id="subtitle">雪兰莪优先 · 全职 · 有佣金</p>
    </div>
    <div class="meta" id="meta"></div>
  </section>

  <div id="news" class="news" hidden></div>

  <section class="tabs" role="tablist" aria-label="职位分组">
    <button role="tab" data-tab="list">职位 <b id="n-list">0</b></button>
    <button role="tab" data-tab="fav">❤ 收藏 <b id="n-fav">0</b></button>
    <button role="tab" data-tab="prac">🎯 练习 <b id="n-prac">0</b></button>
    <button role="tab" data-tab="ni">无兴趣 <b id="n-ni">0</b></button>
    <button role="tab" data-tab="hidden">不太符合 <b id="n-hidden">0</b></button>
  </section>

  <section class="filters" aria-label="筛选">
    <label class="search"><span aria-hidden="true">⌕</span><input id="q" type="search" placeholder="搜职位、公司、地区、关键词"></label>
    <select id="f-cat" aria-label="方向"></select>
    <select id="f-area" aria-label="地区"><option value="klv">雪兰莪 + 吉隆坡</option><option value="selangor">只看雪兰莪</option><option value="kl">只看吉隆坡</option><option value="">全马</option><option value="other">其他州属</option></select>
    <select id="f-src" aria-label="来源"><option value="">所有来源</option></select>
    <select id="f-sort" aria-label="排序"><option value="score">推荐优先</option><option value="new">最新发布</option><option value="pay">广告薪资高</option></select>
    <div class="pay">
      <span>月薪 RM</span>
      <input id="f-min" type="number" min="0" step="500" placeholder="最低" aria-label="最低月薪">
      <input id="f-max" type="number" min="0" step="500" placeholder="最高" aria-label="最高月薪">
      
      <label id="only-comm-wrap"><input id="f-only" type="checkbox"> 只看纯佣金</label>
    </div>
  </section>

  <section class="split">
    <div id="list" class="list" aria-label="职位列表"></div>
    <article id="detail" class="detail" aria-label="职位详情"></article>
  </section>

  <footer>
    <span>✓ 符合　× 不符合　～ 待确认 · 必需条件 × 超过 20% 移到「不太符合」</span>
    <span>只列近 30 天发布、写明薪资的职位 · 收藏和练习不会自动删除 · 无兴趣的职位在发布满 30 天后自动清除</span>
    <span>勾选、收藏、练习、进度记录存在这个浏览器；在「我的条件」填同步码后会自动同步到另一台设备，也能订阅 Apple 日历。</span>
  </footer>
</main>

<dialog id="modal"><form method="dialog" class="dialog-head"><h2 id="modal-title"></h2><button class="flat" aria-label="关闭">✕</button></form><div id="modal-body"></div></dialog>
<div id="toast" role="status" aria-live="polite"></div>
</body>
</html>
